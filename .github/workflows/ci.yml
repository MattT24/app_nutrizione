name: CI Backend

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Il progetto Maven vive in una sottocartella del repo.
        working-directory: ProgettoNutrizionista
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # allineato a java.version del pom
          cache: maven
      - name: Build & test
        run: |
          chmod +x ./mvnw
          ./mvnw -B test
