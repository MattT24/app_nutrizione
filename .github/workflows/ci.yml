name: CI Backend

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # I test PDF (ChromiumPdfRendererTest, PdfPreviewGeneratorTest) richiedono Chromium: si esegue
    # il job dentro l'immagine Playwright ufficiale, con lo STESSO tag pinnato nel Dockerfile — evita
    # di installare i browser a mano e verifica implicitamente la coerenza versione-immagine.
    container:
      image: mcr.microsoft.com/playwright/java:v1.61.0-noble
    defaults:
      run:
        # Il progetto Maven vive in una sottocartella del repo.
        working-directory: ProgettoNutrizionista
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # allineato a java.version del pom
          cache: maven
      - name: Build & test
        run: |
          chmod +x ./mvnw
          ./mvnw -B test

  test-mysql:
    # De-risk parità H2→MySQL: rilancia la STESSA suite contro un MySQL reale effimero (Testcontainers)
    # per intercettare i bug "verde-su-H2, rotto-su-MySQL" (query native, DDL enum/length, charset,
    # semantica lock) prima della prod (Clever/TiDB).
    # runs-on DIRETTO (non il container Playwright): Testcontainers usa il Docker daemon DELL'HOST, che
    # un job-in-container non espone. I 2 test Chromium (renderer PDF, non DB) sono esclusi.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProgettoNutrizionista
    env:
      # Override datasource via env-var (precedenza sopra application-*.properties; ereditate dal fork
      # surefire — più robuste dei -D, non garantiti al fork). ⚠️ Il DRIVER va sovrascritto: i props di
      # test forzano org.h2.Driver → contro un URL jdbc:tc:mysql: Hikari darebbe acceptsURL=false.
      # username/password = default del container MySQL Testcontainers.
      SPRING_DATASOURCE_URL: jdbc:tc:mysql:8.0:///statera_test
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.testcontainers.jdbc.ContainerDatabaseDriver
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # allineato a java.version del pom
          cache: maven
      - name: Test su MySQL reale (Testcontainers)
        run: |
          chmod +x ./mvnw
          ./mvnw -B test -Dtest='!ChromiumPdfRendererTest,!PdfPreviewGeneratorTest'

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        # Gate minimo ("l'immagine si costruisce"): un avvio applicativo end-to-end richiederebbe
        # segreti/DB reali, rimandato a una fase successiva (vedi piano di produzione).
        run: docker build -t app-nutrizione-backend:ci ./ProgettoNutrizionista
