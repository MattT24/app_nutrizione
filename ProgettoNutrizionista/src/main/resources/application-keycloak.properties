# ═══════════════════════════════════════════════════════════════════════════════════
#  Profilo KEYCLOAK — binario auth OIDC/BFF (Fase 2). Attivare con: SPRING_PROFILES_ACTIVE=dev,keycloak
#  (o test,keycloak). Override di application.properties SOLO quando il profilo è attivo → il suite di
#  default (profilo "test") NON lo carica, quindi nessuna discovery di rete / auto-config OIDC in CI.
# ═══════════════════════════════════════════════════════════════════════════════════

# Feature flag: seleziona KeycloakSecurityConfig (2 chain). Validato a startup (AuthProviderStartupValidator).
auth.provider=keycloak

# ── OIDC client (BFF confidential) — Authorization Code + PKCE ──
spring.security.oauth2.client.registration.keycloak.client-id=statera-bff
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:dev-secret-change-me}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloak
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/statera}

# ── Resource server (chain bearer, mobile paziente) — stessa issuer (JWKS Keycloak) ──
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/statera}

# ── Reverse proxy / dev-proxy: onora X-Forwarded-* così il BFF costruisce redirect_uri e success-URL sull'origin
# esterno (dev: :4200 via proxy.conf.json; prod: dominio del reverse proxy A3), non su localhost:8080 interno. ──
server.forward-headers-strategy=framework

# ── Admin API (I10 — erasure cross-store art.17): client service-account client_credentials + base URL/realm ──
# Client DEDICATO least-privilege (solo realm-management:manage-users), isolato dal BFF utente statera-bff.
spring.security.oauth2.client.registration.keycloak-admin.client-id=statera-admin
spring.security.oauth2.client.registration.keycloak-admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:dev-admin-secret-change-me}
spring.security.oauth2.client.registration.keycloak-admin.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak-admin.token-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/statera}/protocol/openid-connect/token
keycloak.admin.base-url=${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8081}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:statera}

# ── Invito onboarding (execute-actions-email): client + redirect così l'utente atterra sull'APP (non sulla console KC) ──
# ⚠️ redirect-uri DEVE essere un valid-redirect del client BFF (dev :4200 già presente nel realm). Prod: dominio reale.
keycloak.invite.client-id=${KEYCLOAK_INVITE_CLIENT_ID:statera-bff}
keycloak.invite.redirect-uri=${KEYCLOAK_INVITE_REDIRECT_URI:http://localhost:4200/}
