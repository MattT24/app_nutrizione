<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <style th:replace="~{pdf/fragments/pdf :: styles}"></style>
</head>
<body>
<div class="sheet" th:classappend="${temaRosso} ? 't-red'">

  <!-- MASTHEAD -->
  <div th:replace="~{pdf/fragments/pdf :: mast('Scheda Alimentare', 'Piano Giornaliero')}"></div>

  <!-- PATIENT STRIP -->
  <div th:replace="~{pdf/fragments/pdf :: schedaPstrip}"></div>

  <!-- RIEPILOGO MACRO + IDRATAZIONE -->
  <th:block th:if="${mostraMacro and hasMacro}">
    <div th:replace="~{pdf/fragments/pdf :: schedaSummary('Totale Giornaliero')}"></div>
  </th:block>

  <!-- PASTI -->
  <table class="sec"><tr>
    <td class="ico"><th:block th:replace="~{pdf/fragments/pdf :: ico('meal')}"></th:block></td>
    <td><h2>Pasti della Giornata</h2></td>
    <td class="meta"><span th:text="${totalePasti}">6</span> pasti</td>
  </tr></table>

  <th:block th:each="p : ${pasti}"><div th:replace="~{pdf/fragments/pdf :: mealCard(${p})}"></div></th:block>

  <!-- INDICAZIONI -->
  <div th:replace="~{pdf/fragments/pdf :: schedaIndicazioni}"></div>

  <!-- FOOTER -->
  <div th:replace="~{pdf/fragments/pdf :: schedaFoot}"></div>

</div>
</body>
</html>
