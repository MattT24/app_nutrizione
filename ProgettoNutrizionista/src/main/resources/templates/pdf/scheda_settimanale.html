<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <style th:replace="~{pdf/fragments/pdf :: styles}"></style>
  <style>@page { size: A4; margin: 12mm 13mm; }</style>
</head>
<body>
<div class="sheet" th:classappend="${temaRosso} ? 't-red'">

  <!-- MASTHEAD -->
  <div th:replace="~{pdf/fragments/pdf :: mast('Scheda Alimentare', 'Piano Settimanale')}"></div>

  <!-- PATIENT STRIP -->
  <div th:replace="~{pdf/fragments/pdf :: schedaPstrip}"></div>

  <!-- RIEPILOGO MACRO + IDRATAZIONE -->
  <th:block th:if="${mostraMacro and hasMacro}">
    <div th:replace="~{pdf/fragments/pdf :: schedaSummary('Totale Settimanale')}"></div>
  </th:block>

  <!-- GIORNI -->
  <th:block th:each="g : ${giorni}">
    <div class="day" th:with="n=${g.pasti.size()}">
      <div class="day-h">
        <div class="dn" th:text="${g.nome}">Giorno</div>
        <div class="dm"><span th:text="${n}">6</span> pasti</div>
      </div>
      <table class="mgrid" th:if="${n > 0}" th:with="rows=${(n + 2) / 3}">
        <tr th:each="r : ${#numbers.sequence(0, rows - 1)}">
          <th:block th:each="c : ${#numbers.sequence(0, 2)}">
            <td class="mcell" th:with="idx=${r * 3 + c}" th:classappend="${(c == 0 ? 'c0 ' : '') + (r == 0 ? 'r0 ' : '') + (idx >= n ? 'empty' : '')}">
              <th:block th:if="${idx &lt; n}"><div th:replace="~{pdf/fragments/pdf :: mealCell(${g.pasti[idx]})}"></div></th:block>
            </td>
          </th:block>
        </tr>
      </table>
    </div>
  </th:block>

  <!-- INDICAZIONI -->
  <div th:replace="~{pdf/fragments/pdf :: schedaIndicazioni}"></div>

  <!-- FOOTER -->
  <div th:replace="~{pdf/fragments/pdf :: schedaFoot}"></div>

</div>
</body>
</html>
