<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <style th:replace="~{pdf/fragments/pdf :: styles}"></style>
</head>
<body>
<div class="sheet" th:classappend="${temaRosso} ? 't-red'">

  <!-- MASTHEAD -->
  <div th:replace="~{pdf/fragments/pdf :: mast('Referto', 'Misurazioni Antropometriche')}"></div>

  <!-- PATIENT STRIP -->
  <div class="strip avoid">
    <table>
      <tr>
        <td class="first" style="width:33%">
          <div class="sk">Paziente</div>
          <div class="sv" th:text="${misurazione.cliente != null} ? ${misurazione.cliente.nome + ' ' + misurazione.cliente.cognome} : '—'">Paziente</div>
        </td>
        <td style="width:33%">
          <div class="sk">Rilevazione</div>
          <div class="sv" th:text="${haPrecedente} ? 'Confronto · 2 sessioni' : 'Prima rilevazione'">Rilevazione</div>
          <div class="sv2"><span th:if="${haPrecedente}" th:text="${dataPrecedente}">01/01</span><span th:if="${haPrecedente}"> &#8594; </span><span th:text="${dataCorrente}">02/02</span></div>
        </td>
        <td style="width:34%">
          <div class="sk">Professionista</div>
          <div class="sv" th:text="${nutrizionista != null} ? ${nutrizionista.nome + ' ' + nutrizionista.cognome} : '—'">Professionista</div>
          <div class="sv2" th:if="${nutrizionista != null and nutrizionista.email != null}" th:text="${nutrizionista.email}">email</div>
        </td>
      </tr>
    </table>
  </div>

  <!-- SINTESI -->
  <table class="sec"><tr>
    <td class="ico"><th:block th:replace="~{pdf/fragments/pdf :: ico('chart')}"></th:block></td>
    <td><h2>Sintesi</h2></td>
    <td class="meta" th:text="${haPrecedente} ? 'Precedente → Attuale' : 'Rilevazione attuale'">meta</td>
  </tr></table>

  <table class="grid3 avoid"><tr>
    <td th:each="k,it : ${kpi}" th:classappend="${it.first} ? 'first' : (${it.last} ? 'last' : '')">
      <div class="kpi">
        <table class="kpi-top"><tr>
          <td class="kpi-well"><th:block th:replace="~{pdf/fragments/pdf :: ico(${k.icon})}"></th:block></td>
          <td class="kpi-lab" th:text="${k.label}">Label</td>
        </tr></table>
        <div class="kpi-num"><b th:text="${k.cur}">—</b><span th:text="${k.unita}">u</span></div>
        <div class="kpi-foot" th:if="${k.hasDelta}">
          <span class="pill" th:classappend="${k.deltaDir}"><th:block th:if="${k.deltaDir != 'flat'}"><th:block th:replace="~{pdf/fragments/pdf :: ico(${k.deltaDir})}"></th:block></th:block><span th:text="${k.delta}">delta</span></span>
          <span class="kpi-from">da <span th:text="${k.prev}">0</span> <span th:text="${k.unita}">u</span></span>
        </div>
        <div class="kpi-cap" th:unless="${k.hasDelta}" th:text="${!haPrecedente} ? 'Prima rilevazione' : (${k.pending} ? 'Da rilevare' : 'Senza confronto')">cap</div>
      </div>
    </td>
  </tr></table>

  <!-- MISURE CORPOREE -->
  <table class="sec"><tr>
    <td class="ico"><th:block th:replace="~{pdf/fragments/pdf :: ico('ruler')}"></th:block></td>
    <td><h2>Misure Corporee</h2></td>
    <td class="meta"><span th:text="${rilevate}">3</span> / <span th:text="${totaleMisure}">9</span> rilevate</td>
  </tr></table>

  <div class="wrap avoid">
    <table class="mt">
      <thead>
        <tr>
          <th>Misura</th>
          <th class="n" th:if="${haPrecedente}" th:text="${dataPrecedente}">prec</th>
          <th class="n" th:text="${haPrecedente} ? ${dataCorrente} : 'Valore'">attuale</th>
          <th class="n" th:if="${haPrecedente}">Variazione</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r,rs : ${righe}" th:classappend="${(r.pending ? 'pending ' : '') + (rs.last ? 'last' : '')}">
          <td>
            <table class="mname"><tr>
              <td class="mi"><div class="mrk" th:classappend="${r.pending} ? 'off'"><th:block th:replace="~{pdf/fragments/pdf :: ico(${r.icon})}"></th:block></div></td>
              <td class="mlabel" th:classappend="${r.pending} ? 'off'" th:text="${r.label}">Misura</td>
            </tr></table>
          </td>
          <td class="n" th:if="${haPrecedente}">
            <span class="read" th:if="${r.hasDelta}"><span th:text="${r.prev}">—</span><span class="u" th:text="${r.unita}">u</span></span>
            <span class="read empty" th:unless="${r.hasDelta}">&#8212;</span>
          </td>
          <td class="n">
            <span class="read" th:if="${!r.pending}"><span th:text="${r.cur}">—</span><span class="u" th:text="${r.unita}">u</span></span>
            <span class="todo" th:if="${r.pending and !haPrecedente}">Da rilevare</span>
            <span class="read empty" th:if="${r.pending and haPrecedente}">&#8212;</span>
          </td>
          <td class="n" th:if="${haPrecedente}">
            <span class="pill" th:if="${r.hasDelta}" th:classappend="${r.deltaDir}"><th:block th:if="${r.deltaDir != 'flat'}"><th:block th:replace="~{pdf/fragments/pdf :: ico(${r.deltaDir})}"></th:block></th:block><span th:text="${r.delta}">delta</span></span>
            <span class="todo" th:unless="${r.hasDelta}">Da rilevare</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- ANDAMENTO -->
  <th:block th:if="${haPrecedente and !trend.isEmpty()}">
    <table class="sec"><tr>
      <td class="ico"><th:block th:replace="~{pdf/fragments/pdf :: ico('down')}"></th:block></td>
      <td><h2>Andamento</h2></td>
      <td class="meta"><span th:text="${dataPrecedente}">d1</span> &#8594; <span th:text="${dataCorrente}">d2</span></td>
    </tr></table>
    <div class="trend avoid">
      <table class="trow" th:each="t,ts : ${trend}" th:classappend="${ts.last} ? 'last'"><tr>
        <td class="tname"><div class="tn" th:text="${t.name}">Misura</div><div class="ts" th:text="${t.sub}">92 → 90 kg</div></td>
        <td class="tplot">
          <svg width="300" height="44" viewBox="0 0 300 44" xmlns="http://www.w3.org/2000/svg">
            <line x1="6" y1="40" x2="294" y2="40" stroke="#eef1f4" stroke-width="1.5"></line>
            <polygon fill="currentColor" fill-opacity="0.10" th:attr="points=|6,${t.y1*0.30+6} 294,${t.y2*0.30+6} 294,40 6,40|"></polygon>
            <polyline fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" th:attr="points=|6,${t.y1*0.30+6} 294,${t.y2*0.30+6}|"></polyline>
            <circle cx="6" r="4" fill="#ffffff" stroke="currentColor" stroke-width="2.4" th:attr="cy=${t.y1*0.30+6}"></circle>
            <circle cx="294" r="4.6" fill="currentColor" th:attr="cy=${t.y2*0.30+6}"></circle>
          </svg>
        </td>
        <td class="tend"><b><span th:text="${t.cur}">90</span><span th:text="${t.unita}">u</span></b><div class="d" th:text="${t.delta}">−2</div></td>
      </tr></table>
    </div>
  </th:block>

  <!-- FOOTER -->
  <div th:replace="~{pdf/fragments/pdf :: footReferto('Referto misurazioni antropometriche')}"></div>

</div>
</body>
</html>
