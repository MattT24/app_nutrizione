# Google Sign-In: Client ID OAuth (Google Cloud Console)
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:581180394205-imqhuceohm2vecsepki26mcljkucflgb.apps.googleusercontent.com}


#=== Mail ===
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Timeout SMTP OBBLIGATORI: sendPdfEmail (share PDF sanitari) è SINCRONO (audit A7). Senza timeout
# il default JavaMail è infinito → un SMTP lento/irraggiungibile appende il thread di richiesta e
# sotto share concorrenti esaurisce il thread pool. Con timeout: fallisce in fretta → riga audit
# FAILURE + errore all'utente. (connectiontimeout=connessione, timeout=lettura, writetimeout=scrittura)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# === AUTH — feature flag binario di autenticazione (migrazione Keycloak, Fase 2) ===
# legacy-jwt (default) = custom-JWT HS256 (LegacySecurityConfig). keycloak = BFF OIDC (KeycloakSecurityConfig).
# Valore validato a startup (AuthProviderStartupValidator, fail-closed su valore ignoto). Il binario keycloak
# si attiva col profilo `keycloak` (application-keycloak.properties: auth.provider=keycloak + spring.security.oauth2.*).
auth.provider=legacy-jwt
# Upper-bound garantito della revoca sessione nel binario keycloak (oltre al Back-Channel Logout). Innocuo in legacy (stateless).
server.servlet.session.timeout=30m

# === B6 Security Headers — lette da SecurityHeaderSupport (Java) e dal customizer del cookie CSRF ===
# Default sicuri per dev/test su HTTP: cookie NON-Secure (altrimenti non parte su http), CSP in enforce.
# In prod: application-prod.properties (cookie-secure=true). report-only=true SOLO per il primo deploy (rollout B6).
app.security.cookie-secure=false
app.security.csp.report-only=false

# === JWT (binario legacy) ===
jwt.secret=${JWT_SECRET}
jwt.expirationMs=3600000

# ═══════════════════════════════════════════════════════════
#  MDSS — Parametri Clinici Esternalizzati
# ═══════════════════════════════════════════════════════════
# Soglie OMS per il sale (g per 100g di alimento).
# Modificabili senza ricompilazione. Default: WARNING > 0.6g, GRAVE > 1.5g
clinica.soglia.sale-warning-g=0.6
clinica.soglia.sale-grave-g=1.5

# Fail-Fast: se true, il motore si interrompe al primo ALERT_GRAVE.
# Default: false (referto esaustivo per trasparenza clinica).
clinica.engine.fail-fast=false

# Motore allergeni data-driven (AllergeneRule) sui 14 allergeni UE via mappa tri-stato + allergeni_default.
# Default effettivo: attivo (AllergeneRule ha matchIfMissing=true). Le vecchie regole hardcoded sono state rimosse.
clinica.engine.use-allergen-rule=true
