server.port=8080

# Profilo attivo di default = dev. In produzione: variabile d'ambiente SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=dev

# --- Configurazione Database TiDB ---

# Driver standard MySQL (TiDB è 100% compatibile)
spring.datasource.url=${DB_URL}

spring.datasource.hikari.max-lifetime=1800000

# Credenziali
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver MySQL (TiDB è compatibile al 100%)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURAZIONE JPA / HIBERNATE
# ==========================================
# DISABILITA OSIV - Previene le query "N+1" silenziose fuori dalle transazioni
spring.jpa.open-in-view=false
# Batch loading globale: evita N+1 su tutte le associazioni lazy (@OneToOne, @ManyToOne, @ElementCollection)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Dialect: rilevato automaticamente da Hibernate 6.6 dalla connessione (TiDB → MySQL 8);
# non va specificato esplicitamente, altrimenti Hibernate logga HHH90000025.

# ddl-auto / show-sql / format_sql sono definiti PER PROFILO:
#   dev  → application-dev.properties  (ddl-auto=update, show-sql=true)
#   prod → application-prod.properties (ddl-auto=validate, show-sql=false)

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

# A1 osservabilità: correlation-id nel pattern di log (MDC popolato da CorrelationIdFilter; "-" se assente).
logging.pattern.level=%5p [%X{correlationId:-}]

file.upload-dir=uploads/

# CORS: origini consentite (lista separata da virgole). Valorizzata per profilo
# (dev: http://localhost:4200; prod: da variabile d'ambiente APP_CORS_ALLOWED_ORIGINS).
app.cors.allowed-origins=

# === Audit log (A7) — Retention ===
# Purge disattivo di DEFAULT (in attesa delle durate dal titolare, cfr. A6). La durata non
# scende comunque MAI sotto i 24 mesi imposti dal Garante (floor nel codice dello scheduler).
app.audit.retention-purge-enabled=false
app.audit.retention-months=24

# === Retention dati clinici (A6) — art. 5(1)(e) — DURATE PROVVISORIE, da confermare col legale (art. 2946 c.c.) ===
# dry-run=true di DEFAULT (SICURO): il ciclo LOGGA soltanto, nessuna cancellazione. Attivare (false) SOLO
# dopo la review dei report di dry-run. Operazione irreversibile → direzione d'errore sempre verso l'over-retention.
retention.clinical.years=10
retention.quarantine.days=90
retention.dry-run=true
retention.safety-threshold-percent=20
retention.safety-threshold-min-absolute=10
retention.max-purge-per-run=50

spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
