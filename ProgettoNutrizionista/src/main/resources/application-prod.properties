# ═══════════════════════════════════════════════════════════
#  Profilo PROD — produzione. Attivare con SPRING_PROFILES_ACTIVE=prod.
# ═══════════════════════════════════════════════════════════

# ddl-auto=validate: NON modifica lo schema, verifica solo che le entità combacino.
# Lo schema va provisionato/migrato a parte (vedi checklist "Prima della produzione").
spring.jpa.hibernate.ddl-auto=validate
# Niente SQL nei log di produzione (rumore + potenziale info-leak).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS: nessun dominio hardcodato (l'origin prod dipende dall'hosting, ancora da decidere).
# Impostare via variabile d'ambiente APP_CORS_ALLOWED_ORIGINS (lista separata da virgole).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# In produzione il super admin deve essere configurato esplicitamente.
superadmin.email=${SUPERADMIN_EMAIL:}
superadmin.password-hash=${SUPERADMIN_PASSWORD_HASH:}

# Timeout SMTP (ms): senza questi, una connessione o un invio che si blocca sul server mail
# terrebbe la richiesta HTTP di /api/fascicolo/{id}/share appesa a tempo indeterminato (l'invio
# è sincrono, per design: vedi EmailService.sendPdfEmail). Definiti qui (profilo prod, tracciato
# da git) e non nel base application.properties (ignorato da git) perché altrimenti dipenderebbero
# da un trasferimento manuale del file e rischierebbero di andare persi o disallinearsi nel tempo.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ═══════════════════════════════════════════════════════════
#  Reverse proxy, sicurezza trasporto e cookie (prod dietro TLS proxy same-origin)
# ═══════════════════════════════════════════════════════════
# Dietro un reverse-proxy che termina il TLS, Spring vede la connessione come HTTP a meno di onorare gli
# header X-Forwarded-*. Con 'framework' Spring li applica → request.isSecure()=true (abilita HSTS e il flag
# Secure sui cookie) e getRemoteAddr() = IP reale del client (audit A7 corretto, non l'IP del proxy).
# NB: presente anche in application-keycloak.properties; qui copre il profilo prod "puro" (legacy-jwt).
server.forward-headers-strategy=framework

# Cookie di SESSIONE (usato nel binario keycloak/BFF; innocuo in legacy, stateless):
#  - secure=true   → inviato solo su HTTPS (in prod è sempre HTTPS dietro il proxy).
#  - same-site=lax → NON 'strict': con 'strict' il cookie non verrebbe rimandato sul redirect di ritorno OIDC
#    (login rotto in prod). 'lax' è il compromesso corretto per il flusso OIDC. http-only resta true (default).
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# B6 — cookie CSRF Secure in prod (sempre HTTPS dietro il proxy); CSP in enforce. ⚠️ Per il PRIMO deploy
# si può mettere app.security.csp.report-only=true, percorrere i 4 flussi reali (login GSI, immagini OFF,
# anteprima PDF blob, Chart.js), verificare zero violazioni in console, poi flippare a false (vedi handoff B6).
app.security.cookie-secure=true
app.security.csp.report-only=false
