# ═══════════════════════════════════════════════════════════
#  Profilo DEV — sviluppo locale (default). Override di application.properties.
# ═══════════════════════════════════════════════════════════

# Hibernate gestisce lo schema in dev (comodo in sviluppo).
spring.jpa.hibernate.ddl-auto=update
# SQL in console + formattazione (solo dev; in prod è spento).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# A3 osservabilità (solo dev): log SQL con parametri bind → scovare N+1 / query lente.
# In application.properties base sono SQL=WARN e bind=OFF (mascherano i parametri).
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# A2 osservabilità (solo dev): espone health/metrics/loggers (default = solo health). In prod NON è
# valorizzato → resta il default, e senza la chain dev-only /actuator/** ricade su authenticated().
management.endpoints.web.exposure.include=health,metrics,loggers
management.endpoint.health.show-details=always

# CORS: dev server Angular.
app.cors.allowed-origins=http://localhost:4200
