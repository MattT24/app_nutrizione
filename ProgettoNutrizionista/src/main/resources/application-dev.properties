# ═══════════════════════════════════════════════════════════
#  Profilo DEV — sviluppo locale (default). Override di application.properties.
# ═══════════════════════════════════════════════════════════

# Hibernate gestisce lo schema in dev (comodo in sviluppo).
spring.jpa.hibernate.ddl-auto=update
# SQL in console + formattazione (solo dev; in prod è spento).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS: dev server Angular.
app.cors.allowed-origins=http://localhost:4200
