# =============================================================================
# Statera — Keycloak 26.7 per SVILUPPO LOCALE (IdP OIDC, pattern BFF)
# =============================================================================
# SCOPO
#   Avvia un'istanza Keycloak locale per sviluppare/testare la migrazione
#   dell'autenticazione a Keycloak (client confidential "statera-bff",
#   Authorization Code + PKCE). Il realm "statera" viene importato in automatico
#   all'avvio da ./docs/keycloak/statera-realm.json (--import-realm).
#
# COME AVVIARE
#   docker compose -f docker-compose.keycloak.yml up
#   (aggiungi -d per farlo girare in background; Ctrl+C o `down` per fermarlo)
#
#   Admin console:  http://localhost:8081  (utente: admin / password: admin)
#   Issuer realm:   http://localhost:8081/realms/statera
#
# PORTE
#   Host 8081 -> container 8080, per NON collidere con il backend Spring Boot
#   che gira su http://localhost:8080.
#
# ⚠️ SOLO-DEV — NON per produzione
#   - `start-dev` usa lo storage embedded `dev-file` (nessun DB container
#     separato: più semplice per lo sviluppo locale). In PRODUZIONE serve
#     `start` (production mode) con un DB gestito esterno (Postgres/MySQL),
#     hostname/TLS configurati e l'admin bootstrap NON hard-coded.
#   - Le credenziali admin (admin/admin), il client secret e le password degli
#     utenti dev qui presenti sono valori di comodo per lo sviluppo: MAI in prod.
# =============================================================================

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: statera-keycloak-dev
    command: start-dev --import-realm
    environment:
      # Admin bootstrap — SOLO-DEV (in prod usare secret/variabili gestite).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Abilita gli endpoint di health (in Keycloak 26 esposti sulla porta di
      # management 9000). Utile per lo sviluppo/diagnostica.
      KC_HEALTH_ENABLED: "true"
    ports:
      # host:container — 8081 sull'host per non collidere col backend su 8080.
      - "8081:8080"
    volumes:
      # Import automatico del realm "statera" (sola lettura). Keycloak legge
      # tutti i *.json in questa cartella all'avvio con --import-realm.
      - ./docs/keycloak:/opt/keycloak/data/import:ro
      # Login theme "statera" (branding fedele). In start-dev la cache temi è disabilitata
      # → gli edit al theme si riflettono al refresh della pagina. Il realm usa loginTheme=statera.
      - ./docs/keycloak/themes/statera:/opt/keycloak/themes/statera:ro

  # MailHog — SMTP sink SOLO-DEV per l'onboarding admin-invite (execute-actions-email: UPDATE_PASSWORD + VERIFY_EMAIL).
  # Il realm punta smtpServer a host "mailhog" porta 1025; le email di invito si leggono nella UI su http://localhost:8025.
  # In PRODUZIONE va configurato un SMTP reale sul realm (non MailHog).
  mailhog:
    image: mailhog/mailhog:latest
    container_name: statera-mailhog-dev
    ports:
      - "1025:1025"   # SMTP (Keycloak → mailhog:1025 sulla rete compose)
      - "8025:8025"   # UI web per leggere le email di invito
