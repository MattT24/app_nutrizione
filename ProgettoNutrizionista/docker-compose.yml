# Compose per il solo backend: il database (TiDB Cloud) è un servizio esterno gestito, non
# containerizzato. Le variabili qui sotto vanno fornite via file .env accanto a questo file
# (formato docker-compose standard, distinto dal .env usato da spring-dotenv per `mvn spring-boot:run`
# in locale) oppure esportate nella shell prima di `docker compose up`.
services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD_HASH: ${SUPERADMIN_PASSWORD_HASH}
      DEMO_MASTER_PASSWORD_HASH: ${DEMO_MASTER_PASSWORD_HASH}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      FILE_UPLOAD_DIR: /app/uploads/loghi
      # Pool di rendering PDF: 2 worker Chromium è il default per un target minimo 2vCPU/4GB;
      # aumentare solo con risorse dedicate proporzionalmente maggiori (ogni worker attivo ~150-300MB).
      PDF_RENDERER_POOL_SIZE: ${PDF_RENDERER_POOL_SIZE:-2}
      PDF_RENDERER_ACQUIRE_TIMEOUT_MS: ${PDF_RENDERER_ACQUIRE_TIMEOUT_MS:-5000}
      PDF_RENDERER_TIMEOUT_MS: ${PDF_RENDERER_TIMEOUT_MS:-20000}
    volumes:
      - uploads_loghi:/app/uploads/loghi
      - uploads_fascicoli:/app/uploads/fascicoli
    # Mitigazione OOM di Chromium raccomandata dalla doc Playwright ("Using --ipc=host is
    # recommended when using Chromium. Without it, Chromium can run out of memory and crash").
    ipc: host
    # Ulteriore rete di sicurezza (ridondante con --disable-dev-shm-usage già passato a Chromium
    # in ChromiumPdfRenderer): il default Docker di 64MB per /dev/shm fa crashare Chromium.
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  uploads_loghi:
  uploads_fascicoli:
